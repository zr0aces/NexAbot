server {
 listen 8080;
 server_name _;
 access_log off;
 # Do not record OAuth authorization codes in upstream error request URLs.
 error_log /dev/null;
 resolver 127.0.0.11 valid=5s ipv6=off;
 set $gallery_api api:3000;
 client_max_body_size 1m;
 # Trust forwarded addresses only from private ranges (an upstream proxy); the API gets the result in X-Real-IP.
 set_real_ip_from 10.0.0.0/8;
 set_real_ip_from 172.16.0.0/12;
 set_real_ip_from 192.168.0.0/16;
 set_real_ip_from 127.0.0.0/8;
 real_ip_header X-Forwarded-For;
 real_ip_recursive on;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location / { proxy_pass http://$gallery_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For ""; proxy_buffering off; }
}
