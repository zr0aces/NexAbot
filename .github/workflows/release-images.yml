name: Publish release images

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify release and build images
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          node scripts/sync-version.mjs --check
          version="$(cat VERSION)"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Release tag must equal v$version"
            exit 1
          fi
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rivosnap"
          for service in api worker web; do
            image="$prefix-$service:$version"
            docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.version=$version" \
              -f "Dockerfile.$service" -t "$image" .
            docker run --rm --network none --entrypoint cat "$image" /app/VERSION | cmp VERSION -
            echo "$image" >> "$RUNNER_TEMP/release-images"
          done

      - name: Push verified images to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          while IFS= read -r image; do
            docker push "$image"
          done < "$RUNNER_TEMP/release-images"
